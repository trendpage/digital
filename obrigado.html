<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f0fdf4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 48px 32px;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(2,125,108,.08);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h1 {
    color: #065f46;
    font-size: 22px;
    margin: 0 0 12px;
  }
  p {
    color: #4a5568;
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1 id="titulo">Obrigado pela sua resposta!</h1>
  <p id="texto">Sua opinião é o que nos ajuda a melhorar o guia pros próximos clientes.</p>
</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var e = params.get('e');
  var titulo = document.getElementById('titulo');
  var texto = document.getElementById('texto');

  var mensagens = {
  satisfeito: {
    t: 'Obrigado pela sua resposta!',
    p: 'Ficamos felizes que o guia atendeu o que você esperava. Sua palavra ajuda a melhorar o material.'
  },
  insatisfeito: {
    t: 'Obrigado pela honestidade.',
    p: 'Sentimos não ter atendido sua expectativa. Se puder contar o que faltou, responda ao email que você recebeu — vamos ler pessoalmente e tentar resolver.'
  },
  sim: {
    t: 'Obrigado por nos contar!',
    p: 'Ficamos felizes que o guia te ajudou a resolver.'
  },
  parte: {
    t: 'Obrigado por nos contar.',
    p: 'Se tiver dúvida em algum passo, responda ao email e vamos te ajudar.'
  },
  nao: {
    t: 'Sentimos muito.',
    p: 'Queremos entender o que deu errado. Responda ao email contando o que aconteceu e vamos tentar resolver.'
  }
};

  if (e && mensagens[e]) {
    titulo.textContent = mensagens[e].t;
    texto.textContent = mensagens[e].p;
  }
</script>
</body>
</html>
