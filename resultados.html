<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Resultados</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; padding: 32px; max-width: 800px; margin: 0 auto; }
  h1 { color: #065f46; }
  .box { background: white; padding: 24px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .num { font-size: 36px; font-weight: 700; color: #065f46; }
  .label { color: #718096; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .section { margin-top: 32px; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
  .row:last-child { border: 0; }
  button { background: #065f46; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #login { text-align: center; padding: 64px 0; }
  input { padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-right: 8px; }
</style>
</head>
<body>

<div id="login">
  <h1>🔒 Painel de Feedback</h1>
  <input type="password" id="senha" placeholder="Senha de acesso">
  <button onclick="entrar()">Entrar</button>
</div>

<div id="painel" style="display:none">
  <h1>📊 Feedback dos Clientes</h1>

  <div class="section">
    <h2>Clareza antes da compra (do PDF)</h2>
    <div class="box">
      <div class="row">
        <span>✓ Estava claro</span>
        <span class="num" id="clara">—</span>
      </div>
      <div class="row">
        <span>✗ Tive dúvida</span>
        <span class="num" id="duvida">—</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Resultado do produto (do email)</h2>
    <div class="box">
      <div class="row">
        <span>🟢 Resolveu</span>
        <span class="num" id="sim">—</span>
      </div>
      <div class="row">
        <span>🟡 Em parte</span>
        <span class="num" id="parte">—</span>
      </div>
      <div class="row">
        <span>🔴 Não resolveu</span>
        <span class="num" id="nao">—</span>
      </div>
    </div>
  </div>

  <p style="color:#718096;font-size:13px;margin-top:24px">
    Taxa de resposta esperada: 15-25% dos clientes. Lembre que silenciosos tendem ao meio-termo.
  </p>
</div>

<script>
  function entrar() {
    var s = document.getElementById('senha').value;
    if (!s) return;
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    carregar(s);
  }

  async function carregar(senha) {
    var eventos = ['clara', 'duvida', 'sim', 'parte', 'nao'];
    for (var ev of eventos) {
      try {
        var r = await fetch('/.netlify/functions/stats?e=' + ev + '&s=' + encodeURIComponent(senha));
        var data = await r.json();
        document.getElementById(ev).textContent = data.count || 0;
      } catch(e) {
        document.getElementById(ev).textContent = 'erro';
      }
    }
  }
</script>

</body>
</html>
